# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

misc {
  # Put windows on the workspace their process was launched from.
  # 2 (persistent) rather than 1 (single-shot): Unity maps a splash window
  # first, which would eat the single shot, and the editor window that appears
  # a minute later would land on whatever workspace you switched to meanwhile.
  # Escape hatch per app: windowrule = match:class ^(foo)$, workspace unset
  initial_workspace_tracking = 2
}
