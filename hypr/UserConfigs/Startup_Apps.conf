# Commands and Apps to be executed at launch

exec-once = GSK_RENDERER=cairo swayosd-server --top-margin 0.10
# exec-once = [workspace 1 silent] code
# exec-once = [workspace 2 silent] kitty
# exec-once = [workspace 3 silent] brave-browser
# exec-once = [workspace 4 silent] slack


# New Unity windows follow the workspace Unity is already on
exec-once = $HOME/.config/hypr/scripts/AppWindowFollow.sh

# GTK4/Nautilus file chooser: xdg-desktop-portal-gnome serves FileChooser
# (see ~/.config/xdg-desktop-portal/portals.conf). It cannot be d-bus activated
# here because its systemd unit waits on graphical-session.target, which Fedora
# never activates under Hyprland, so start it by hand after PortalHyprland.sh
# has finished killing and restarting the portal stack.
exec-once = sleep 8 && /usr/libexec/xdg-desktop-portal-gnome
