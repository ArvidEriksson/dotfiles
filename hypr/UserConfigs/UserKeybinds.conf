# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME









bindd = $mainMod, V, VS Code, exec, code

unbind = $mainMod, J, new empty workspace, workspace, emptynm
bindd = $mainMod, J, new empty workspace, workspace, empty


# =====================================================================
# Arrow-key layout mirroring CachyOS Noctalia (cachyos-hypr-noctalia)
#   Super              + Arrow -> focus window      (unchanged)
#   Super + Shift      + Arrow -> move window       (was resize)
#   Super + Ctrl       + Arrow -> switch workspace  (was move window)
#   Super + Ctrl+Shift + Arrow -> send window to adjacent workspace
#   Super + Alt+Shift  + Arrow -> resize window     (displaced from Shift)
# =====================================================================

# Switch workspaces. Up is deliberately left unbound, as in CachyOS Noctalia.
unbind = $mainMod CTRL, left, move window left, movewindow, l
unbind = $mainMod CTRL, right, move window right, movewindow, r
unbind = $mainMod CTRL, up, move window up, movewindow, u
unbind = $mainMod CTRL, down, move window down, movewindow, d
bindd = $mainMod CTRL, left, previous workspace, workspace, m-1
bindd = $mainMod CTRL, right, next workspace, workspace, m+1
bindd = $mainMod CTRL, down, first empty workspace, workspace, emptym

# Move window within the layout, displaced here from Super + Ctrl
unbind = $mainMod SHIFT, left, resize left (-50), resizeactive, -50 0
unbind = $mainMod SHIFT, right, resize right (+50), resizeactive, 50 0
unbind = $mainMod SHIFT, up, resize up (-50), resizeactive, 0 -50
unbind = $mainMod SHIFT, down, resize down (+50), resizeactive, 0 50
bindd = $mainMod SHIFT, left, move window left, movewindow, l
bindd = $mainMod SHIFT, right, move window right, movewindow, r
bindd = $mainMod SHIFT, up, move window up, movewindow, u
bindd = $mainMod SHIFT, down, move window down, movewindow, d

# Send window to adjacent workspace and follow it. Silent equivalent stays on Super + Ctrl + [ ]
bindd = $mainMod CTRL SHIFT, left, move to previous workspace, movetoworkspace, m-1
bindd = $mainMod CTRL SHIFT, right, move to next workspace, movetoworkspace, m+1
bindd = $mainMod CTRL SHIFT, down, move to first empty workspace, movetoworkspace, emptym

# Resize, displaced here from Super + Shift
binded = $mainMod ALT SHIFT, left, resize left (-50), resizeactive, -50 0
binded = $mainMod ALT SHIFT, right, resize right (+50), resizeactive, 50 0
binded = $mainMod ALT SHIFT, up, resize up (-50), resizeactive, 0 -50
binded = $mainMod ALT SHIFT, down, resize down (+50), resizeactive, 0 50

# Workspace switching now lives on the arrows
unbind = $mainMod, period, next workspace, workspace, e+1
unbind = $mainMod, comma, previous workspace, workspace, e-1

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset
