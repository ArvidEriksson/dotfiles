# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules 
# This file will not be modified during dotfiles updates


windowrule = match:class ^(Spotify|spotify)$, opacity 0.95 0.9
windowrule = match:class ^(Slack|slack)$, opacity 0.95 0.9

# --- Unity Editor (XWayland) ---
# VERIFY the class first: open Unity, then run `hyprctl clients | grep -i class`.
# Unity reports class "Unity"; adjust the regex below if yours differs.
#
# Pin Unity to the 1.0-scale Philips so the UI is crisp AND correctly sized
# (the 4K Dell @ 1.25 makes Unity's non-scaling UI tiny). Drop this line to
# let Unity open wherever you launch it.
windowrule = match:class ^(Unity)$, monitor desc:Philips Consumer Electronics Company PHL 325E1
# Float + center Unity's transient popups (color picker, dropdowns) which
# otherwise map at 0x0 and tile. Main editor window has a real title; popups don't.
windowrule = match:class ^(Unity)$, match:title ^()$, float on, center on

layerrule = animation none, match:namespace tooltip
layerrule = animation none, match:namespace waybar

# swaync blur
layerrule = blur on, match:namespace swaync-control-center
layerrule = ignore_alpha 0.3, match:namespace swaync-control-center
layerrule = blur on, match:namespace swaync-notification-window
layerrule = ignore_alpha 0.3, match:namespace swaync-notification-window

#  Optional Layer rules
#  To Resolve blurred corners in rofi  Uncomment
# layerrule = blur on, ignore_alpha 0, match:namespace rofi


