# BACKGROUND
background {
    monitor =
    path = ~/Pictures/wallpapers/train.jpg
    blur_passes = 0
    blur_size = 0
    contrast = 0.8916
    brightness = 0.8916
    vibrancy = 0.8916
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# FROSTED PANEL
shape {
    monitor =
    size = 650, 480
    color = rgba(55, 35, 55, 0.50)
    rounding = 40
    border_size = 1
    border_color = rgba(255, 255, 255, 0.12)
    rotate = 0
    xray = false

    position = 0, 20
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%H:%M")</span>"
    color = rgba(255, 250, 240, 0.95)
    font_size = 82
    font_family = SF Pro Display Bold
    position = 0, 152
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = rgba(255, 250, 240, 0.95)
    font_size = 26
    font_family = SF Pro Display Bold
    position = 0, 80
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 420, 72
    color = rgba(255, 255, 255, 0.1)
    rounding = -1
    border_size = 0
    border_color = rgba(255, 255, 255, 1)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -20
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = rgba(255, 250, 240, 0.95)
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    font_size = 22
    font_family = SF Pro Display Bold
    position = 0, -20
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 420, 72
    outline_thickness = 0
    dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(255, 255, 255, 0)
    inner_color = rgba(255, 255, 255, 0.1)
    font_color = rgb(200, 200, 200)
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <span foreground="##ffffff99">Password</span>
    hide_input = false
    position = 0, -110
    halign = center
    valign = center
}